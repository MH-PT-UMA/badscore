<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f0d">
<meta name="description" content="声で点数を入れられるバドミントンの得点板">
<title>バド試合記録</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0b0f0d; --panel:#151c18; --panel2:#1c2520; --line:#2a352e; --ink:#f1f5f2; --muted:#a3afa7;
  --accent:#3fb874; --accent-ink:#06150c; --yellow:#f3d34a; --red:#d6453c;
  --a:#3987e5; --b:#d95926;
  --court:#16301f; --courtline:rgba(255,255,255,.75);
  --top:env(safe-area-inset-top,0px); --bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:"Barlow Condensed","Zen Kaku Gothic New",sans-serif;font-variant-numeric:tabular-nums}

/* ===== match screen (one screen, no scroll) ===== */
#match{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;padding-top:var(--top);padding-bottom:var(--bottom)}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px}
.bar .info{flex:1;text-align:center;font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .info small{color:var(--muted);font-weight:500;margin-left:6px}
.iconbtn{display:flex;align-items:center;gap:6px;padding:9px 12px;font-weight:700;font-size:.92rem}
.iconbtn svg{width:20px;height:20px}

.court{position:relative;margin:0 10px;display:grid;grid-template-rows:1fr 6px 1fr;min-height:0;border:2px solid var(--courtline);border-radius:6px;overflow:hidden;background:var(--court)}
.net{background:repeating-linear-gradient(90deg,#fff 0 8px,transparent 8px 13px);opacity:.9}
.half{position:relative;display:grid;min-height:0;border:0;border-radius:0;padding:10px 10px;text-align:center;color:var(--ink);transition:background .12s}
.half.A{background:linear-gradient(var(--grad),rgba(57,135,229,.30),rgba(57,135,229,.08))}
.half.B{background:linear-gradient(var(--grad),rgba(217,89,38,.30),rgba(217,89,38,.08))}
.half.near{--grad:0deg;grid-template-rows:auto 1fr}
.half.far{--grad:180deg;grid-template-rows:1fr auto}
.half.far .pls{order:2}
.half:active{filter:brightness(1.25)}
.half.flash{animation:flash .5s ease-out}
@keyframes flash{0%{box-shadow:inset 0 0 0 6px #fff}100%{box-shadow:inset 0 0 0 0 transparent}}
.main{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;gap:0}
.tn{font-weight:700;font-size:clamp(1rem,4.6vw,1.35rem);display:flex;align-items:center;gap:8px;max-width:100%}
.tn .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gw{display:flex;gap:4px}
.gw i{width:10px;height:10px;border-radius:50%;border:2px solid rgba(255,255,255,.6)}
.gw i.on{background:#fff;border-color:#fff}
.sc{font-family:"Barlow Condensed",sans-serif;font-weight:700;line-height:.86;font-size:clamp(5rem,min(34vw,20vh),12rem);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pls{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}
.pl{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;flex:1}
.pl .nm{font-weight:700;font-size:clamp(.95rem,4.2vw,1.2rem);padding:5px 12px;border-radius:999px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(0,0,0,.28)}
.pl .side{font-size:.72rem;color:var(--muted)}
.pl.srv .nm{background:var(--yellow);color:#1b1a07}
.pl.rcv .nm{background:#fff;color:#101411}
.pl .tag{font-size:.7rem;font-weight:700;letter-spacing:.06em}
.pl.empty{visibility:hidden}
.diag{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ovl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,8,6,.72);z-index:3}
.ovl .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center}
.ovl h2{margin:0;font-size:1.3rem}
.ovl p{margin:0;color:var(--muted)}
.pick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--yellow);color:#1b1a07;font-weight:700;padding:10px 18px;border-radius:999px;z-index:2;white-space:nowrap;pointer-events:none;font-size:1.05rem;box-shadow:0 6px 20px rgba(0,0,0,.4)}

.dock{min-width:0;padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px}
.heard{font-size:.92rem;min-height:1.45em;display:flex;gap:8px;align-items:baseline;padding:0 4px;white-space:nowrap;overflow:hidden}
.heard .live{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.heard .res{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.heard .res.ok{color:var(--accent)} .heard .res.ng{color:#ff8a7a}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;align-items:center}
.chips::-webkit-scrollbar{display:none}
.chips .lab{flex:none;font-size:.75rem;color:var(--muted);padding:0 2px}
.chips button{flex:none;padding:8px 13px;border-radius:999px;font-size:.9rem;background:var(--panel2)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.chips button.who{border-color:var(--accent)}
.chips .sep{flex:none;width:1px;height:22px;background:var(--line)}
.microw{display:flex;gap:8px}
.mic{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:1.1rem;padding:15px;border-radius:16px;background:var(--accent);color:var(--accent-ink);border:0}
.mic svg{width:24px;height:24px}
.mic[aria-pressed="true"]{background:var(--red);color:#fff;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(214,69,60,.5)}100%{box-shadow:0 0 0 14px rgba(214,69,60,0)}}
.mode{min-width:76px;font-size:.85rem;font-weight:700;border-radius:16px;line-height:1.2}
.mode small{display:block;font-weight:500;color:var(--muted);font-size:.7rem}

/* landscape: halves side by side */
@media (orientation:landscape){
  #match{grid-template-columns:minmax(0,1fr) minmax(240px,32vw);grid-template-rows:auto minmax(0,1fr)}
  .dock{overflow-y:auto}
  #match .bar{grid-column:1/-1}
  .court{grid-template-rows:none;grid-template-columns:1fr 6px 1fr;margin:0 0 10px 10px}
  .net{background:repeating-linear-gradient(180deg,#fff 0 8px,transparent 8px 13px)}
  .half.near{order:0;--grad:90deg;grid-template-rows:none;grid-template-columns:1fr auto}
  .half.near .pls{order:2}
  .net{order:1}
  .half.far{order:2;--grad:270deg;grid-template-rows:none;grid-template-columns:auto 1fr}
  .half.far .pls{order:0}
  .pls{flex-direction:column;justify-content:space-between;min-width:96px;height:100%}
  .sc{font-size:clamp(5rem,min(18vw,40vh),13rem)}
  .dock{justify-content:flex-end;padding-top:0}
}
@media (prefers-reduced-motion:reduce){.mic[aria-pressed="true"],.half.flash{animation:none}}

/* ===== pages: setup / analysis / menu ===== */
.page{position:fixed;inset:0;overflow-y:auto;background:var(--bg);z-index:10;padding:calc(var(--top) + 8px) 16px calc(var(--bottom) + 32px)}
.page .inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.phead{display:flex;align-items:center;gap:10px;position:sticky;top:calc(-8px - var(--top));background:var(--bg);padding:8px 0;z-index:1}
.phead h1{margin:0;font-size:1.2rem;flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:.8rem;letter-spacing:.12em;color:var(--muted);font-weight:700}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:var(--muted)}
input,select{font:inherit;font-size:1.05rem;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;background:transparent;padding:12px 10px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.teamhead{display:flex;align-items:center;gap:8px;font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.primary{background:var(--accent);color:var(--accent-ink);border:0;font-weight:700;font-size:1.1rem;padding:15px;border-radius:14px}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{text-align:left;padding:15px 16px;font-size:1.02rem;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.menu button small{font-weight:500;color:var(--muted)}
.cmd{display:flex;gap:8px}
.cmd input{flex:1}

/* analysis */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.stat small{color:var(--muted);font-size:.78rem}
.pair{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pair span{display:flex;align-items:center;gap:6px;font-size:.88rem;min-width:0}
.pair b{font-family:"Barlow Condensed",sans-serif;font-size:1.6rem;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:.86rem;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:16px;height:3px;display:inline-block;border-radius:2px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;border-radius:8px;padding:6px 8px;white-space:nowrap;transform:translate(-50%,-115%)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-size:.76rem}
.hbar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.hbar i{display:block;height:100%}
.gsel button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.gsel{display:flex;gap:6px;flex-wrap:wrap}
.gsel button{padding:7px 12px;border-radius:999px;font-size:.88rem}
.hist{display:flex;flex-direction:column;gap:6px}
.hist button{text-align:left;font-size:.9rem}
</style>
</head>
<body>

<!-- ================= MATCH (one screen) ================= -->
<div id="match">
  <div class="bar">
    <button class="iconbtn" id="menuBtn" aria-label="メニュー">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="info" id="info">バド試合記録</div>
    <button class="iconbtn" id="undoBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      取り消し
    </button>
  </div>

  <div class="court" id="court">
    <button class="half far" id="hFar" aria-label="">
      <div class="pls"><div class="pl" data-slot="a"></div><div class="pl" data-slot="b"></div></div>
      <div class="main"><div class="tn"><span class="t"></span><span class="gw"></span></div><div class="sc">0</div></div>
    </button>
    <div class="net" aria-hidden="true"></div>
    <button class="half near" id="hNear" aria-label="">
      <div class="pls"><div class="pl" data-slot="a"></div><div class="pl" data-slot="b"></div></div>
      <div class="main"><div class="tn"><span class="t"></span><span class="gw"></span></div><div class="sc">0</div></div>
    </button>
    <svg class="diag" id="diag" aria-hidden="true"></svg>
    <div class="toast" id="toast" hidden></div>
    <div class="ovl" id="ovl" hidden><div class="box" id="ovlBox"></div></div>
  </div>

  <div class="dock">
    <div class="heard" aria-live="polite"><span class="live" id="heardLive">得点した側をタップ、またはマイクで話してください</span><span class="res" id="heardRes"></span></div>
    <div class="chips" id="chips"></div>
    <div class="microw">
      <button id="mic" class="mic" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/></svg>
        <span id="micLbl">声で入力</span>
      </button>
      <button id="modeBtn" class="mode" aria-label="聞き取り方を切り替え">ずっと聞く<small>切り替え</small></button>
    </div>
  </div>
</div>

<!-- ================= MENU ================= -->
<section class="page" id="pMenu" hidden>
  <div class="inner">
    <div class="phead"><h1>メニュー</h1><button id="menuClose">閉じる</button></div>
    <div class="menu">
      <button id="mNew">新しい試合<small>名前・点数の設定</small></button>
      <button id="mAnalysis">分析を見る<small>点数の推移・得点の内訳</small></button>
      <button id="mSwap">エンドを入れ替える<small>コートの上下を反対に</small></button>
      <button id="mSpeak">読み上げ<small id="mSpeakState">オン</small></button>
      <button id="install" hidden>ホーム画面に追加<small>アプリとして使う</small></button>
    </div>
    <div class="card">
      <h2>文字で入力</h2>
      <form class="cmd" id="cmdForm">
        <input id="cmd" autocomplete="off" enterkeyhint="send" placeholder="例：A スマッシュ／佐藤 アウト">
        <button class="primary" type="submit" style="font-size:1rem;padding:11px 16px">入力</button>
      </form>
      <p class="hint" id="cmdFb">声が入らないときはここに打ち込めます。</p>
    </div>
    <div class="card">
      <h2>声での入れ方</h2>
      <p class="hint" style="font-size:.9rem;color:var(--ink)">「A」「Bスマッシュ」「原田プッシュ」「佐藤アウト」（ミスは相手の得点）「取り消し」<br>体育館がうるさいときは「1回ずつ」にすると、ボタンを押したときだけ聞き取ります。声での入力にはインターネット接続が必要です。</p>
    </div>
  </div>
</section>

<!-- ================= SETUP ================= -->
<section class="page" id="pSetup" hidden>
  <div class="inner">
    <div class="phead"><h1>新しい試合</h1><button id="setupClose">戻る</button></div>
    <div class="seg" role="group" aria-label="種目">
      <button data-type="s" aria-pressed="false">シングルス</button>
      <button data-type="d" aria-pressed="true">ダブルス</button>
    </div>
    <div class="card">
      <div class="teamhead"><i class="dot" style="background:var(--a)"></i>A側</div>
      <label class="f">チーム名<input id="nA" value="チームA" maxlength="12"></label>
      <div class="grid2"><label class="f"><span class="pl1">選手1</span><input id="pA0" placeholder="例：原田" maxlength="8"></label><label class="f p2">選手2<input id="pA1" placeholder="例：佐藤" maxlength="8"></label></div>
    </div>
    <div class="card">
      <div class="teamhead"><i class="dot" style="background:var(--b)"></i>B側</div>
      <label class="f">チーム名<input id="nB" value="チームB" maxlength="12"></label>
      <div class="grid2"><label class="f"><span class="pl1">選手1</span><input id="pB0" placeholder="例：田中" maxlength="8"></label><label class="f p2">選手2<input id="pB1" placeholder="例：鈴木" maxlength="8"></label></div>
    </div>
    <div class="card">
      <div class="grid2">
        <label class="f">点数<select id="pts"><option value="21">21点</option><option value="15">15点</option><option value="11">11点</option></select></label>
        <label class="f">ゲーム数<select id="bo"><option value="3">3ゲーム</option><option value="1">1ゲーム</option></select></label>
      </div>
      <h2>最初にサーブする人</h2>
      <div class="pick" id="pickServer"></div>
      <h2 class="p2">最初に受ける人</h2>
      <div class="pick p2" id="pickRecv"></div>
      <h2>画面の手前（下）にいるチーム</h2>
      <div class="pick" id="pickNear"></div>
    </div>
    <button class="primary" id="start">試合開始</button>
    <p class="hint">記録はこのスマホの中に保存されます。</p>
  </div>
</section>

<!-- ================= ANALYSIS ================= -->
<section class="page" id="pAnalysis" hidden>
  <div class="inner">
    <div class="phead"><button id="anBack">← 試合へ</button><h1 id="anTitle">分析</h1></div>
    <div class="card">
      <p id="anResult" style="margin:0;font-weight:700;font-size:1.05rem"></p>
      <div class="gsel" id="gSel"></div>
      <div class="legend" id="legend"></div>
      <div id="charts"></div>
    </div>
    <div class="card"><h2>数字で見る</h2><div class="stats" id="stats"></div></div>
    <div class="card"><h2>得点の内訳</h2><div id="breakdown"></div></div>
    <div class="card" id="playerCard"><h2>選手ごと</h2><div class="tbl" id="players"></div></div>
    <div class="card"><h2>ラリーの記録</h2><div class="tbl" id="log"></div></div>
    <div class="card">
      <h2>まとめ・書き出し</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button id="copy">まとめをコピー</button><button id="csv">CSVで保存</button></div>
      <p class="hint" id="copyFb"></p>
      <textarea id="copyTxt" readonly rows="6" style="width:100%;font:inherit;font-size:.86rem;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);color:var(--ink)" hidden></textarea>
    </div>
    <div class="card"><h2>過去の試合</h2><div class="hist" id="history"></div></div>
  </div>
</section>

<script>
(()=>{
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- storage (前のバージョンの記録もそのまま読めます) ----------
const KEY='bad-score-v1';
const load=()=>{ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } };
let store=load(); if(!store.history) store.history=[];
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(store)); }catch(e){} };
let match=store.current&&!store.current.sample?store.current:null;
let viewMatch=null;
let prefs=Object.assign({speak:true,vmode:'cont'},store.prefs||{});
const savePrefs=()=>{ store.prefs=prefs; save(); };

// ---------- rules ----------
const WIN={smash:'スマッシュ',push:'プッシュ',drive:'ドライブ',drop:'ドロップ',hairpin:'ヘアピン',clear:'クリア',ace:'サービスエース'};
const ERR={net:'ネット',out:'アウト',smiss:'サービスミス',fault:'フォルト',miss:'その他のミス'};
const other=t=>t==='A'?'B':'A';
const capOf=p=>p===21?30:(p===15?21:15);
const half=p=>Math.ceil(p/2);
const pname=(m,t,i)=>{ const tm=m.teams[t]; const n=(tm.players[i]||'').trim(); return n||(m.type==='s'?tm.name:tm.name+(i+1)); };
const tname=(m,t)=>{ const tm=m.teams[t]; return m.type==='s'?((tm.players[0]||'').trim()||tm.name):tm.name; };
const reasonLabel=r=>r?(r[0]==='w'?WIN[r.slice(2)]:ERR[r.slice(2)]):'';

function replay(m,g){
  const st={score:{A:0,B:0},serve:g.start.serve,pos:{}};
  const r=g.start.serve, o=other(r);
  st.pos[r]={R:g.start.server,L:1-g.start.server};
  st.pos[o]={R:g.start.receiver,L:1-g.start.receiver};
  if(m.type==='s'){ st.pos.A={R:0,L:0}; st.pos.B={R:0,L:0}; }
  const snap=()=>{ const court=st.score[st.serve]%2===0?'R':'L'; return {score:{...st.score},serve:st.serve,court,server:st.pos[st.serve][court],receiver:st.pos[other(st.serve)][court],pos:JSON.parse(JSON.stringify(st.pos))}; };
  const before=[];
  for(const ra of g.rallies){
    before.push(snap());
    st.score[ra.w]++;
    if(ra.w===st.serve){ if(m.type==='d'){ const p=st.pos[ra.w]; [p.R,p.L]=[p.L,p.R]; } }
    else st.serve=ra.w;
  }
  return {before,now:snap()};
}
function gameWinner(m,s){ for(const t of ['A','B']){ const a=s[t], b=s[other(t)]; if((a>=m.P&&a-b>=2)||a>=m.cap) return t; } return null; }
const winsOf=(m,t)=>m.games.filter(g=>g.winner===t).length;
const curGame=()=>match&&match.games[match.games.length-1];
const isFinalGame=m=>m.need>1&&m.games.length===m.need*2-1;
function nearTeam(m){
  const gi=m.games.length-1, g=m.games[gi];
  let flips=gi+(m.flip||0);
  if(isFinalGame(m)){ const s=replay(m,g).now.score; if(Math.max(s.A,s.B)>=half(m.P)) flips++; }
  const base=m.near0||'A';
  return flips%2===0?base:other(base);
}

// ---------- scoring ----------
let toastTimer=null;
function toast(t,ms=2600){ const el=$('toast'); el.textContent=t; el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.hidden=true,ms); }
function addPoint(w,reason,who){
  if(!match||match.finished) return null;
  const g=curGame(); if(g.winner) return null;
  const before=replay(match,g).now;
  g.rallies.push({w,reason:reason||null,who:who??null,t:Date.now()});
  const now=replay(match,g).now, sc=now.score;
  const ev={serveOver:w!==before.serve};
  const win=gameWinner(match,sc);
  if(win){ g.winner=win; ev.game=win; if(winsOf(match,win)>=match.need){ match.finished=true; ev.match=win; archive(match); } }
  else if(Math.max(sc.A,sc.B)===half(match.P)&&Math.max(before.score.A,before.score.B)<half(match.P)){ ev.interval=true; ev.swap=isFinalGame(match); }
  save(); render();
  const el=nearTeam(match)===w?$('hNear'):$('hFar'); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  if(ev.interval) toast(ev.swap?'インターバル・エンド交代':'インターバル');
  return ev;
}
function scoreWithCall(w,reason,who){
  const ev=addPoint(w,reason,who); if(!ev) return null;
  const g=curGame();
  if(ev.game){ const s=replay(match,g).now.score; say(`ゲーム。${tname(match,ev.game)}。${s[ev.game]} 対 ${s[other(ev.game)]}`+(ev.match?'。試合終了です':'')); }
  else say((ev.serveOver?'サービスオーバー。':'')+callScore()+(ev.interval?'。インターバル':''));
  return ev;
}
function undo(){
  if(!match) return false;
  let g=curGame();
  if(!g.rallies.length&&match.games.length>1){ match.games.pop(); g=curGame(); }
  if(!g.rallies.length) return false;
  g.rallies.pop(); g.winner=null;
  if(match.finished){ match.finished=false; store.history=store.history.filter(h=>h.id!==match.id); }
  save(); render(); return true;
}
function archive(m){ store.history=[m,...store.history.filter(h=>h.id!==m.id)].slice(0,40); }
function callScore(){ if(!match) return ''; const g=curGame(), now=replay(match,g).now; return g.winner?'':`${now.score[now.serve]} 対 ${now.score[other(now.serve)]}`; }

    showOvl(`<h2>第${match.games.length}ゲーム終了</h2><p>${esc(tname(match,w))} が ${s[w]}-${s[other(w)]} で取りました。エンドを交代します。</p>`+

function scoresText(m){ return m.games.filter(g=>g.rallies.length).map(g=>{const s=replay(m,g).now.score; return s.A+'-'+s.B;}).join(', '); }
function showOvl(html){ $('ovlBox').innerHTML=html; $('ovl').hidden=false; }

function drawDiag(){

// ---------- reason chips (直前のラリーの決め手) ----------
function lastRally(){ if(!match) return null; for(let i=match.games.length-1;i>=0;i--){ const r=match.games[i].rallies; if(r.length) return r[r.length-1]; } return null; }
function renderChips(){

  }

  h+=`<span class="sep"></span><span class="lab">相手のミス</span>`+Object.entries(ERR).map(([k,v])=>`<button data-r="e:${k}" aria-pressed="${r.reason==='e:'+k}">${v}</button>`).join('');

// ---------- text / voice command parsing ----------
const WINKW=[['smash',/スマッシュ|すまっしゅ|スマッシ/],['push',/プッシュ|ぷっしゅ/],['drive',/ドライブ|どらいぶ/],['drop',/ドロップ|どろっぷ|カット/],['hairpin',/ヘアピン|へあぴん|ヘヤピン/],['clear',/クリア|くりあ/],['ace',/エース|えーす/]];
const ERRKW=[['smiss',/サービスミス|サーブミス|さーぶみす/],['fault',/フォルト|ふぉると/],['out',/アウト|あうと/],['net',/ネット(?!前)|ねっと/],['miss',/ミス|みす/]];
const norm=s=>s.normalize('NFKC').replace(/\s+/g,'').toLowerCase();
function parse(text){
  const t=norm(text); if(!t) return null;
  if(/取り消し|とりけし|取消|戻して|もどして|キャンセル|undo/.test(t)) return {undo:true};
  let reason=null;
  for(const [k,re] of ERRKW) if(re.test(t)){ reason='e:'+k; break; }
  if(!reason) for(const [k,re] of WINKW) if(re.test(t)){ reason='w:'+k; break; }
  let team=null, who=null;
  for(const tm of ['A','B']) for(const i of [0,1]){ const n=norm(match.teams[tm].players[i]||''); if(n&&t.includes(n)){ team=tm; who=i; } }
  if(!team) for(const tm of ['A','B']){ const n=norm(match.teams[tm].name); if(n&&t.includes(n)) team=tm; }
  if(!team){ if(/(^|[^a-z])a([^a-z]|$)|えー|エー/.test(t)) team='A'; else if(/(^|[^a-z])b([^a-z]|$)|びー|ビー/.test(t)) team='B'; }
  if(!team) return {error:true};
  const isErr=reason&&reason[0]==='e';
  return {w:isErr?other(team):team,reason,who:match.type==='d'?who:null};
}
function heard(live,res,cls){ if(live!=null) $('heardLive').textContent=live; if(res!=null){ const r=$('heardRes'); r.textContent=res; r.className='res'+(cls?' '+cls:''); } }
function runCommand(text,src){
  if(!match){ heard('','先に「新しい試合」を始めてください','ng'); return; }
  const r=parse(text);
  if(!r||r.error){ heard(src==='voice'?'「'+text+'」':'', 'どちらの得点か分かりませんでした','ng'); return false; }
  if(r.undo){ if(undo()){ heard(src==='voice'?'「'+text+'」':'','取り消しました','ok'); say('取り消しました。'+callScore()); } return true; }
  if(match.finished||curGame().winner){ heard('','ゲームが終わっています','ng'); return false; }
  scoreWithCall(r.w,r.reason,r.who);
  heard(src==='voice'?'「'+text+'」':'',`${tname(match,r.w)}に1点`+(r.reason?`（${reasonLabel(r.reason)}）`:''),'ok');
  return true;
}
$('cmdForm').onsubmit=e=>{ e.preventDefault(); const v=$('cmd').value; if(runCommand(v,'text')){ $('cmd').value=''; $('cmdFb').textContent='入力しました：'+v; closePage('pMenu'); } else $('cmdFb').textContent='どちらの得点か分かりませんでした（チーム名・選手名・A/Bを入れてください）'; };

// ---------- voice ----------
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null, listening=false, speaking=false, restartTimer=null;
const FILLER=/えーと|ええと|えっと|ええっと|えーっと|あのー|あの|うーん|んー/g;
function setMicUI(){
  $('mic').setAttribute('aria-pressed',listening);
  $('micLbl').textContent=listening?(prefs.vmode==='cont'?'聞いています（押すと止める）':'どうぞ'):'声で入力';
  $('modeBtn').innerHTML=(prefs.vmode==='cont'?'ずっと聞く':'1回ずつ')+'<small>切り替え</small>';
}
function startRec(){
  if(!SR||rec) return;
  const r=new SR(); rec=r;
  r.lang='ja-JP'; r.interimResults=true; r.continuous=prefs.vmode==='cont'; r.maxAlternatives=3;
  r.onresult=e=>{ for(let i=e.resultIndex;i<e.results.length;i++){ const res=e.results[i]; if(res.isFinal) handleSpeech(Array.from(res).map(a=>a.transcript)); else heard('…'+res[0].transcript,''); } };
  r.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){ listening=false; setMicUI(); heard('','マイクが許可されていません（ブラウザの設定で許可してください）','ng'); }
    else if(e.error==='network'){ heard('','声の入力にはインターネット接続が必要です','ng'); }
    else if(e.error==='audio-capture'){ listening=false; setMicUI(); heard('','マイクが見つかりません','ng'); }
  };
  r.onend=()=>{
    if(rec===r) rec=null;
    if(listening&&prefs.vmode==='cont'&&!speaking){ clearTimeout(restartTimer); restartTimer=setTimeout(()=>{ if(listening&&!rec&&!speaking) startRec(); },250); }
    else if(prefs.vmode==='once'&&!speaking){ listening=false; setMicUI(); }
  };
  try{ r.start(); }catch(err){ rec=null; }
}
function stopRec(){ clearTimeout(restartTimer); if(rec){ const r=rec; rec=null; try{ r.abort(); }catch(e){} } }
function handleSpeech(alts){
  for(const a of alts){
    const t=a.replace(FILLER,'').trim();
    if(!t||norm(t).length>24) continue;
    if(!match) break;
    const r=parse(t);
    if(r&&(r.undo||r.w)){ runCommand(t,'voice'); return; }
  }
  heard('「'+(alts[0]||'')+'」','得点の指示として読み取れませんでした','ng');
}
function say(text){
  if(!text||!prefs.speak||!('speechSynthesis' in window)) return;
  const u=new SpeechSynthesisUtterance(text); u.lang='ja-JP'; u.rate=1.05;
  speaking=true; stopRec();
  let ended=false;
  const done=()=>{ if(ended) return; ended=true; speaking=false; if(listening&&prefs.vmode==='cont') startRec(); else if(prefs.vmode==='once'){ listening=false; setMicUI(); } };
  u.onend=done; u.onerror=done;
  try{ speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){ done(); }
  setTimeout(done,6000);
}
$('mic').onclick=()=>{
  if(!SR){ heard('','このブラウザは声の入力に対応していません（AndroidのChromeで開いてください）','ng'); return; }
  if(listening){ listening=false; stopRec(); setMicUI(); heard('止めました',''); return; }
  listening=true; setMicUI(); heard(prefs.vmode==='cont'?'聞いています':'どうぞ',''); startRec(); keepAwake();
};
$('modeBtn').onclick=()=>{ prefs.vmode=prefs.vmode==='cont'?'once':'cont'; savePrefs(); if(listening){ listening=false; stopRec(); } setMicUI(); heard(prefs.vmode==='cont'?'ずっと聞くモード：一度押すと止めるまで聞き取ります':'1回ずつモード：押したときだけ聞き取ります',''); };

let wake=null;
async function keepAwake(){ try{ if('wakeLock' in navigator&&!wake){ wake=await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>{ wake=null; }); } }catch(e){} }

$('start').onclick=()=>{
  if(match&&!match.finished&&match.games.some(g=>g.rallies.length)) archive(match);
  const P=+$('pts').value;
  match={id:Date.now().toString(36),created:new Date().toISOString(),type:setupType,
    teams:{A:{name:$('nA').value.trim()||'チームA',players:[$('pA0').value.trim(),$('pA1').value.trim()]},
           B:{name:$('nB').value.trim()||'チームB',players:[$('pB0').value.trim(),$('pB1').value.trim()]}},
    P,cap:capOf(P),need:+$('bo').value===3?2:1,near0,flip:0,
    games:[{start:{serve:sv.t,server:setupType==='d'?sv.i:0,receiver:setupType==='d'?rcv:0},rallies:[],winner:null}],finished:false};
  store.current=match; save(); closePage('pSetup'); hideOvl(); render();
  heard('得点した側をタップ、またはマイクで話してください','');
};

// ---------- analysis ----------
let gSel='all';
function openAnalysis(m){ viewMatch=m||null; gSel='all'; renderAnalysis(); openPage('pAnalysis'); }
$('anBack').onclick=()=>closePage('pAnalysis');
function analyze(m,games){
  const res={};
  for(const t of ['A','B']) res[t]={pts:0,served:0,wonServe:0,recv:0,wonRecv:0,run:0,win:{},err:{},unk:0};
  const rows=[];
  games.forEach(({g,gi})=>{
    const rp=replay(m,g); let cur=null,len=0;
    g.rallies.forEach((ra,i)=>{
      const b=rp.before[i], srv=b.serve, rc=other(srv);
      res[srv].served++; res[rc].recv++; res[ra.w].pts++;
      if(ra.w===srv) res[srv].wonServe++; else res[rc].wonRecv++;
      if(cur===ra.w) len++; else {cur=ra.w; len=1;}
      res[ra.w].run=Math.max(res[ra.w].run,len);
      if(!ra.reason) res[ra.w].unk++;
      else if(ra.reason[0]==='w') res[ra.w].win[ra.reason]=(res[ra.w].win[ra.reason]||0)+1;
      else res[other(ra.w)].err[ra.reason]=(res[other(ra.w)].err[ra.reason]||0)+1;
      const after={...b.score}; after[ra.w]++;
      rows.push({gi,i:i+1,ra,b,after});
    });
  });
  return {res,rows};
}
const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'–';
function renderAnalysis(){
  const m=viewMatch;
  renderHistory();
  const empty=!m||!m.games.some(g=>g.rallies.length);
  ['legend','charts','stats','breakdown','players','log','gSel'].forEach(id=>$(id).innerHTML='');
  if(empty){ $('anTitle').textContent='分析'; $('anResult').textContent='記録された試合がまだありません。'; $('playerCard').hidden=true; return; }
  const played=m.games.map((g,gi)=>({g,gi})).filter(x=>x.g.rallies.length);
  if(gSel!=='all'&&!played.some(x=>x.gi===+gSel)) gSel='all';
  $('gSel').innerHTML=['all',...played.map(x=>String(x.gi))].map(k=>`<button data-g="${k}" aria-pressed="${gSel===k}">${k==='all'?'全体':'第'+(+k+1)+'ゲーム'}</button>`).join('');
  $('gSel').querySelectorAll('button').forEach(b=>b.onclick=()=>{ gSel=b.dataset.g; renderAnalysis(); });
  const sel=gSel==='all'?played:played.filter(x=>x.gi===+gSel);
  $('anTitle').textContent=`${tname(m,'A')} vs ${tname(m,'B')}`;
  const wA=winsOf(m,'A'), wB=winsOf(m,'B');
  $('anResult').textContent=(m.finished?`${tname(m,wA>wB?'A':'B')}の勝ち　`:'試合中　')+`（${scoresText(m)}）`;
  $('legend').innerHTML=['A','B'].map(t=>`<span><i style="background:var(--${t.toLowerCase()})"></i>${esc(tname(m,t))}</span>`).join('');
  sel.forEach(x=>drawChart(m,x.g,x.gi,sel.length>1));
  const {res,rows}=analyze(m,sel);
  const tile=(label,fa,fb,note)=>`<div class="stat"><small>${label}</small>
    <div class="pair"><span><i class="dot" style="background:var(--a)"></i>${esc(tname(m,'A'))}</span><b>${fa}</b></div>
    <div class="pair"><span><i class="dot" style="background:var(--b)"></i>${esc(tname(m,'B'))}</span><b>${fb}</b></div>${note?`<small>${note}</small>`:''}</div>`;
  $('stats').innerHTML=tile('得点',res.A.pts,res.B.pts)+tile('最大連続得点',res.A.run,res.B.run)+
    tile('サーブ時の得点率',pct(res.A.wonServe,res.A.served),pct(res.B.wonServe,res.B.served),'自分たちのサーブで始まったラリー')+
    tile('レシーブ時の得点率',pct(res.A.wonRecv,res.A.recv),pct(res.B.wonRecv,res.B.recv),'相手のサーブで始まったラリー');
  const bd=t=>{
    const r=res[t], o=res[other(t)], win=sum(r.win), gift=sum(o.err), unk=r.unk, tot=Math.max(1,win+gift+unk);
    const list=(obj,dict)=>Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${dict[k.slice(2)]} ${v}`).join('・')||'なし';
    const c=`var(--${t.toLowerCase()})`;
    return `<div class="stat" style="gap:8px"><div class="teamhead"><i class="dot" style="background:${c}"></i>${esc(tname(m,t))}　得点 ${r.pts}</div>
      <div class="hbar" role="img" aria-label="決め球${win}、相手のミス${gift}、未記録${unk}"><i style="width:${win/tot*100}%;background:${c}"></i><i style="width:${gift/tot*100}%;background:${c};opacity:.45"></i><i style="width:${unk/tot*100}%;background:var(--line)"></i></div>
      <small>決め球 ${win}（${list(r.win,WIN)}）</small><small>相手のミスでの得点 ${gift}</small><small>自分たちのミス ${sum(r.err)}（${list(r.err,ERR)}）</small><small>決め手の記録なし ${unk}</small></div>`;
  };
  $('breakdown').innerHTML=`<div class="stats">${bd('A')}${bd('B')}</div><p class="hint" style="margin-top:8px">濃い色＝決め球、薄い色＝相手のミス、灰色＝決め手を記録していない得点</p>`;
  if(m.type==='d'){
    $('playerCard').hidden=false;
    const pr=[];
    for(const t of ['A','B']) for(const i of [0,1]){
      let w=0,e=0,svn=0,svw=0;
      rows.forEach(r=>{ if(r.ra.reason&&r.ra.who===i){ if(r.ra.reason[0]==='w'&&r.ra.w===t) w++; if(r.ra.reason[0]==='e'&&r.ra.w===other(t)) e++; }
        if(r.b.serve===t&&r.b.server===i){ svn++; if(r.ra.w===t) svw++; } });
      pr.push(`<tr><td><i class="dot" style="background:var(--${t.toLowerCase()})"></i> ${esc(pname(m,t,i))}</td><td>${w}</td><td>${e}</td><td>${svn}</td><td>${pct(svw,svn)}</td></tr>`);
    }
    $('players').innerHTML=`<table><thead><tr><th>選手</th><th>決め球</th><th>ミス</th><th>サーブ数</th><th>サーブ時の得点率</th></tr></thead><tbody>${pr.join('')}</tbody></table>`;
  } else $('playerCard').hidden=true;
  $('log').innerHTML=`<table><thead><tr><th>G</th><th>#</th><th>サーバー</th><th>得点</th><th>スコア</th><th>決め手</th></tr></thead><tbody>${
    rows.map(r=>`<tr><td>${r.gi+1}</td><td>${r.i}</td><td>${esc(pname(m,r.b.serve,r.b.server))}</td><td><i class="dot" style="background:var(--${r.ra.w.toLowerCase()})"></i> ${esc(tname(m,r.ra.w))}</td><td class="num">${r.after.A}-${r.after.B}</td><td>${r.ra.reason?esc(reasonLabel(r.ra.reason)+(m.type==='d'&&r.ra.who!=null?'（'+pname(m,r.ra.reason[0]==='w'?r.ra.w:other(r.ra.w),r.ra.who)+'）':'')):'–'}</td></tr>`).join('')}</tbody></table>`;
  const lines=[`${tname(m,'A')} vs ${tname(m,'B')}：${$('anResult').textContent.trim()}`,
    `得点 ${res.A.pts}-${res.B.pts}／最大連続 ${res.A.run}-${res.B.run}`,
    `サーブ時の得点率 ${pct(res.A.wonServe,res.A.served)} / ${pct(res.B.wonServe,res.B.served)}`,
    `レシーブ時の得点率 ${pct(res.A.wonRecv,res.A.recv)} / ${pct(res.B.wonRecv,res.B.recv)}`];
  for(const t of ['A','B']) lines.push(`${tname(m,t)}：決め球 ${sum(res[t].win)}、ミス ${sum(res[t].err)}`);
  $('copyTxt').value=lines.join('\n');
}
function drawChart(m,g,gi,titled){
  const rp=replay(m,g), n=g.rallies.length;
  const pA=[0], pB=[0]; rp.before.forEach((b,i)=>{ const s={...b.score}; s[g.rallies[i].w]++; pA.push(s.A); pB.push(s.B); });
  const maxY=Math.max(m.P,...pA,...pB);
  const W=640,H=250,l=34,r=86,t=14,b=30, pw=W-l-r, ph=H-t-b;
  const X=i=>l+(n?i/n:0)*pw, Y=v=>t+ph-(v/maxY)*ph;
  const step=a=>a.map((v,i)=>i===0?`M${X(0)},${Y(v)}`:`H${X(i)}V${Y(v)}`).join('');
  let grid='';
  [0,Math.round(maxY/3),Math.round(maxY*2/3),maxY].forEach(v=>{ grid+=`<line x1="${l}" x2="${l+pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${l-6}" y="${Y(v)+4}" font-size="12" text-anchor="end" fill="var(--muted)">${v}</text>`; });
  [0,Math.round(n/2),n].filter((v,i,a)=>a.indexOf(v)===i).forEach(v=>{ grid+=`<text x="${X(v)}" y="${H-10}" font-size="12" text-anchor="middle" fill="var(--muted)">${v}</text>`; });
  grid+=`<text x="${l+pw+r-4}" y="${H-10}" font-size="12" text-anchor="end" fill="var(--muted)">ラリー</text>`;
  const eA=pA[n], eB=pB[n]; let ya=Y(eA), yb=Y(eB); if(Math.abs(ya-yb)<15){ if(ya<=yb){ya-=8;yb+=8;} else {ya+=8;yb-=8;} }
  const wrap=document.createElement('div'); wrap.className='chart';
  wrap.innerHTML=(titled?`<p class="hint" style="margin:8px 0 2px">第${gi+1}ゲーム（${eA}-${eB}）</p>`:'')+
  `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="第${gi+1}ゲームの点数の推移">${grid}
    <path d="${step(pB)}" fill="none" stroke="var(--b)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="${step(pA)}" fill="none" stroke="var(--a)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${X(n)}" cy="${Y(eA)}" r="4.5" fill="var(--a)" stroke="var(--panel)" stroke-width="2"/>
    <circle cx="${X(n)}" cy="${Y(eB)}" r="4.5" fill="var(--b)" stroke="var(--panel)" stroke-width="2"/>
    <text x="${X(n)+9}" y="${ya+4}" font-size="13" font-weight="700" fill="var(--ink)">${esc(tname(m,'A'))} ${eA}</text>
    <text x="${X(n)+9}" y="${yb+4}" font-size="13" font-weight="700" fill="var(--ink)">${esc(tname(m,'B'))} ${eB}</text>
    <line class="xh" y1="${t}" y2="${t+ph}" stroke="var(--muted)" visibility="hidden"/>
    <rect x="${l}" y="${t}" width="${pw}" height="${ph}" fill="transparent"/></svg><div class="tip" hidden></div>`;
  $('charts').appendChild(wrap);
  const svg=wrap.querySelector('svg'), tip=wrap.querySelector('.tip'), xh=wrap.querySelector('.xh');
  const move=e=>{ if(!n) return; const rc=svg.getBoundingClientRect(), sx=(e.clientX-rc.left)/rc.width*W;
    const i=Math.max(1,Math.min(n,Math.round((sx-l)/pw*n))); xh.setAttribute('x1',X(i)); xh.setAttribute('x2',X(i)); xh.setAttribute('visibility','visible');
    const ra=g.rallies[i-1]; tip.hidden=false; tip.style.left=(X(i)/W*100)+'%'; tip.style.top=(Math.min(Y(pA[i]),Y(pB[i]))/H*rc.height)+'px';
    tip.textContent=`${i}本目 ${pA[i]}-${pB[i]}　${tname(m,ra.w)}${ra.reason?'（'+reasonLabel(ra.reason)+'）':''}`; };
  svg.addEventListener('pointermove',move); svg.addEventListener('pointerdown',move);
  svg.addEventListener('pointerleave',()=>{ tip.hidden=true; xh.setAttribute('visibility','hidden'); });
}
function renderHistory(){
  const list=[...(match&&!match.finished&&match.games.some(g=>g.rallies.length)?[match]:[]),...store.history];
  $('history').innerHTML=list.length?'':'<p class="hint">まだありません。</p>';
  list.forEach(m=>{
    const b=document.createElement('button'), d=new Date(m.created);
    b.textContent=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}　${tname(m,'A')} vs ${tname(m,'B')}（${scoresText(m)}）${m.finished?'':'・試合中'}`;
    if(viewMatch&&viewMatch.id===m.id) b.style.borderColor='var(--accent)';
    b.onclick=()=>{ viewMatch=m; gSel='all'; renderAnalysis(); $('pAnalysis').scrollTop=0; };
    $('history').appendChild(b);
  });
}
$('copy').onclick=async()=>{
  const txt=$('copyTxt').value;
  try{ await navigator.clipboard.writeText(txt); $('copyFb').textContent='コピーしました。'; }
  catch(e){ const ta=$('copyTxt'); ta.hidden=false; ta.focus(); ta.select(); $('copyFb').textContent='下の文字を選択してコピーしてください。'; }
};
$('csv').onclick=()=>{
  const m=viewMatch; if(!m) return;
  const lines=[['ゲーム','ラリー','サーブ側','サーバー','レシーバー','得点','A','B','決め手','誰が','時刻']];
  m.games.forEach((g,gi)=>{ const rp=replay(m,g); g.rallies.forEach((ra,i)=>{ const b=rp.before[i], af={...b.score}; af[ra.w]++; const wt=ra.reason?(ra.reason[0]==='w'?ra.w:other(ra.w)):null;
    lines.push([gi+1,i+1,tname(m,b.serve),pname(m,b.serve,b.server),pname(m,other(b.serve),b.receiver),tname(m,ra.w),af.A,af.B,ra.reason?reasonLabel(ra.reason):'',(m.type==='d'&&ra.who!=null&&wt)?pname(m,wt,ra.who):'',ra.t?new Date(ra.t).toLocaleTimeString('ja-JP'):'']); }); });
  const csv='﻿'+lines.map(r=>r.map(v=>{ v=String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(',')).join('\r\n');
  const d=new Date(m.created), p2=x=>String(x).padStart(2,'0');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=`badminton_${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
  $('copyFb').textContent='CSVを保存しました。';
};

// ---------- install / offline ----------
let installEvt=null;
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; $('install').hidden=false; });
$('install').onclick=async()=>{ if(!installEvt) return; installEvt.prompt(); try{ await installEvt.userChoice; }catch(e){} installEvt=null; $('install').hidden=true; };
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')) navigator.serviceWorker.register('sw.js').catch(()=>{});

// ---------- boot ----------
setMicUI();
if(!SR) heard('','このブラウザは声の入力に対応していません（タップで入力できます）','');
render();
})();
